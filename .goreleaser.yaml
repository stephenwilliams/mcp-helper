version: 2

project_name: mcp-helper

before:
  hooks:
    - go mod tidy

builds:
  - id: mcp-helper
    main: .
    binary: mcp-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/stephenwilliams/mcp-helper/cmd.Version={{.Version}}
      - -X github.com/stephenwilliams/mcp-helper/cmd.Commit={{.Commit}}
      - -X github.com/stephenwilliams/mcp-helper/cmd.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: mcp-helper
    repository:
      owner: stephenwilliams
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/stephenwilliams/mcp-helper"
    description: "CLI tool for managing MCP (Model Context Protocol) server configurations"
    license: "MIT"
    install: |
      bin.install "mcp-helper"
    test: |
      system "#{bin}/mcp-helper", "version"
