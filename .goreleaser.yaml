version: 2

project_name: mcp-helper

before:
  hooks:
    - go mod tidy
    # Generate shell completions
    - go build -o /tmp/mcp-helper-completions .
    - mkdir -p completions
    - /tmp/mcp-helper-completions completion bash > completions/mcp-helper.bash
    - /tmp/mcp-helper-completions completion zsh > completions/mcp-helper.zsh
    - /tmp/mcp-helper-completions completion fish > completions/mcp-helper.fish

builds:
  - id: mcp-helper
    main: .
    binary: mcp-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/stephenwilliams/mcp-helper/cmd.Version={{.Version}}
      - -X github.com/stephenwilliams/mcp-helper/cmd.Commit={{.Commit}}
      - -X github.com/stephenwilliams/mcp-helper/cmd.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completions/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: mcp-helper
    repository:
      owner: stephenwilliams
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    commit_msg_template: "Cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/stephenwilliams/mcp-helper"
    description: "CLI tool for managing MCP (Model Context Protocol) server configurations"
    binaries:
      - mcp-helper
    completions:
      bash: completions/mcp-helper.bash
      zsh: completions/mcp-helper.zsh
      fish: completions/mcp-helper.fish
