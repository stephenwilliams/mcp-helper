version: 2

project_name: mcp-helper

before:
  hooks:
    - go mod tidy

builds:
  - id: mcp-helper
    main: .
    binary: mcp-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/stephenwilliams/mcp-helper/cmd.Version={{.Version}}
      - -X github.com/stephenwilliams/mcp-helper/cmd.Commit={{.Commit}}
      - -X github.com/stephenwilliams/mcp-helper/cmd.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
