version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - dupl
    - funlen
    - gocognit
    - cyclop
    - nestif
  settings:
    funlen:
      lines: 150
      statements: 80
    gocognit:
      min-complexity: 50
    cyclop:
      max-complexity: 25
    nestif:
      min-complexity: 8
    dupl:
      threshold: 150
  exclusions:
    generated: lax
    rules:
      # Allow longer/complex functions in TUI code
      - path: "tui/"
        linters:
          - funlen
          - gocognit
          - cyclop
          - nestif
      # Allow complexity in test files
      - path: "_test\\.go"
        linters:
          - funlen
          - dupl
          - gocognit
          - cyclop
          - errcheck
      # Allow complexity in test harness infrastructure
      - path: "internal/tuiharness/"
        linters:
          - funlen
          - gocognit
          - cyclop
          - errcheck
          - unparam
          - unused
      # Ignore staticcheck style suggestions (QF* codes)
      - linters:
          - staticcheck
        text: "^QF"
